name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发版需要：创建 Release 与 tag
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # —— 安装 Android SDK ——
    # ubuntu-latest runner 默认没有 Android SDK，必须显式安装，否则
    # assembleDebug/assembleRelease 会因找不到 SDK（compileSdk 34 / build-tools）而失败。
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK packages & accept licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Grant execute permission
      run: chmod +x ./gradlew

    - name: Verify assets (static regression)
      run: python3 ci/verify.py

    # release 包在 build.gradle 里已用仓库内 debug.keystore 签名，产物可直接安装。
    - name: Build Debug + Release APK
      run: >
        ./gradlew assembleDebug assembleRelease
        -PappVersionCode=${{ github.run_number }}
        -PappVersionName=1.0.${{ github.run_number }}
        --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    # —— 发版：每次 push 到 main/master 自动建一个 Release，
    #    把已签名的 release APK 和 debug APK 挂上去，直接拿到安装链接。
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: v${{ github.run_number }}
        name: 健康生活 v1.0.${{ github.run_number }}
        body: |
          自动构建 · 提交 ${{ github.sha }}
          - app-release.apk：已签名，可直接安装
          - app-debug.apk：调试包
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
