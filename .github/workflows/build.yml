name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发版需要：创建 Release 与 tag
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ubuntu-latest 自带 Android SDK。这里让 setup-android 一次性装好
    # platform-34 / build-tools 34，并静默接受许可：
    #   - packages：自动安装所需 SDK 包（免去单独 sdkmanager 步骤）
    #   - log-accepted-android-sdk-licenses: false：不再逐条打印许可协议全文，
    #     避免日志被 7 大段协议刷屏、看起来像卡住。
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        log-accepted-android-sdk-licenses: false

    # 兜底修复：gradle-wrapper.jar 是二进制文件，网页分批上传时最容易漏掉。
    # 缺了它 ./gradlew 会直接报 "Could not find or load main class
    # org.gradle.wrapper.GradleWrapperMain"，ci/verify.py 也会 FAIL 这一项。
    # 这里检测到缺失/损坏就自动补回来，不让它反复把 CI 弄红。
    - name: Ensure Gradle wrapper
      run: |
        JAR=gradle/wrapper/gradle-wrapper.jar
        valid() {
          [ -s "$JAR" ] || return 1
          python3 -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); sys.exit(0 if any('GradleWrapperMain' in n for n in z.namelist()) else 1)" "$JAR" 2>/dev/null
        }
        if valid; then
          echo "gradle-wrapper.jar 正常，跳过"
          exit 0
        fi
        mkdir -p gradle/wrapper
        rm -f "$JAR"
        echo "gradle-wrapper.jar 缺失或损坏，尝试从官方仓库恢复（gradle 8.5.0）..."
        curl -fsSL --retry 3 --max-time 60 -o "$JAR" \
          https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar || true
        if valid; then
          echo "已从 raw.githubusercontent.com 恢复"
          exit 0
        fi
        rm -f "$JAR"
        if command -v gradle >/dev/null 2>&1; then
          echo "下载未成功，改用运行器自带 gradle 重新生成 wrapper"
          gradle wrapper --gradle-version 8.5 --distribution-type bin || true
        fi
        if valid; then
          echo "已用本机 gradle 重新生成 wrapper"
          exit 0
        fi
        echo "::error::无法恢复 gradle/wrapper/gradle-wrapper.jar，请手动上传该文件（约 45KB，位于 gradle/wrapper/ 下）"
        exit 1

    # Windows 上上传的 gradlew 常被存成 CRLF，shebang 变成 "#!/bin/sh\r"，
    # 一执行就报 "./gradlew: /bin/sh^M: bad interpreter"（exit 126）。
    # 这里无条件把行尾规整成 LF 再授权——不管仓库里那份是什么状态都能跑。
    - name: Normalize gradlew + execute permission
      run: |
        sed -i 's/\r$//' ./gradlew
        chmod +x ./gradlew
        echo "shebang: $(head -1 ./gradlew)"

    - name: Verify assets (static regression)
      run: python3 ci/verify.py

    # release 包在 build.gradle 里已用仓库内 debug.keystore 签名，产物可直接安装。
    - name: Build Debug + Release APK
      run: >
        ./gradlew assembleDebug assembleRelease
        -PappVersionCode=${{ github.run_number }}
        -PappVersionName=1.0.${{ github.run_number }}
        --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    # —— 发版：每次 push 到 main/master 自动建一个 Release，
    #    把已签名的 release APK 和 debug APK 挂上去，直接拿到安装链接。
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: v${{ github.run_number }}
        name: 健康生活 v1.0.${{ github.run_number }}
        body: |
          自动构建 · 提交 ${{ github.sha }}
          - app-release.apk：已签名，可直接安装
          - app-debug.apk：调试包
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
